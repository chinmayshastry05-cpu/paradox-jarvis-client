# Publish release artifacts to PyPI.
#
# Manual-only (workflow_dispatch). The `publish` input gates the two
# upload steps: dispatching without it only builds and validates.
# Validation (artifact listing, 20 MiB budget, twine check) always runs
# and precedes both uploads.
name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Actually upload to PyPI (TestPyPI first, then PyPI)"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v4
      - name: Build release artifacts
        run: uv build
      - name: Validate release artifacts
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys
          from pathlib import Path

          MAX_BYTES = 20 * 1024 * 1024
          dist = Path("dist")
          wheels = sorted(dist.glob("*.whl")) if dist.is_dir() else []
          sdists = sorted(dist.glob("*.tar.gz")) if dist.is_dir() else []
          artifacts = wheels + sdists
          for artifact in artifacts:
              size = artifact.stat().st_size
              print(f"{artifact.name}: {size} bytes ({size / 1024 / 1024:.2f} MiB)")
          if not wheels or not sdists:
              print("Expected at least one wheel and one sdist in dist/", file=sys.stderr)
              sys.exit(1)
          failed = False
          for artifact in artifacts:
              size = artifact.stat().st_size
              if size > MAX_BYTES:
                  print(f"{artifact.name} exceeds the 20 MiB upload budget", file=sys.stderr)
                  failed = True
          if failed:
              sys.exit(1)
          PY
          uvx twine check --strict dist/*
      - name: Publish to TestPyPI
        if: ${{ inputs.publish }}
        run: uv publish --publish-url https://test.pypi.org/legacy/
      - name: Publish to PyPI
        if: ${{ inputs.publish }}
        run: uv publish
